<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Your Booking | Rebel Ranch Ministries</title>
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <link rel="stylesheet" href="assets/css/public-surface.css">
  <link rel="stylesheet" href="assets/css/booking.css">
  <script src="assets/js/public-shell.js" defer></script>
  <!-- AI-Agent: Claude Code (Claude Opus 5.5) | Session: Custom booking system build (2026-09-24) -->
</head>
<body class="rrm-phase-one rrm-site-standard">
  <main class="booking-page">
    <p class="eyebrow">Rebel Ranch Ministries</p>
    <h1>Manage Your Booking</h1>
    <p id="page-notice" class="booking-notice" role="status" aria-live="polite">Loading your booking…</p>

    <section id="visit" class="booking-step booking-hidden" aria-labelledby="visit-heading">
      <div class="booking-panel">
        <h2 class="step-heading" id="visit-heading">Your booking</h2>
        <p class="summary-line" id="visit-what"></p>
        <p class="summary-line" id="visit-when"></p>
        <p class="summary-line" id="visit-party"></p>
        <p class="summary-line" id="visit-status"></p>
        <div class="btn-row" id="actions">
          <button type="button" class="btn supporting" id="reschedule-btn">Reschedule</button>
          <button type="button" class="btn supporting" id="cancel-btn">Cancel booking</button>
        </div>
        <p class="fine-print" id="policy"></p>
      </div>

      <div class="booking-panel booking-hidden" id="confirm-cancel" role="group" aria-labelledby="confirm-cancel-heading">
        <h2 class="step-heading" id="confirm-cancel-heading">Cancel this booking?</h2>
        <p>This can't be undone. You can book a new time afterward.</p>
        <div class="btn-row">
          <button type="button" class="btn primary" id="confirm-cancel-btn">Yes, cancel my booking</button>
          <button type="button" class="btn supporting" id="keep-btn">Keep my booking</button>
        </div>
      </div>

      <div class="booking-panel booking-hidden" id="picker"></div>
      <div class="booking-panel booking-hidden" id="confirm-move" role="group" aria-labelledby="confirm-move-heading">
        <h2 class="step-heading" id="confirm-move-heading">Move your booking?</h2>
        <p class="summary-line" id="move-summary"></p>
        <div class="btn-row">
          <button type="button" class="btn primary" id="confirm-move-btn">Confirm new time</button>
        </div>
      </div>
    </section>
  </main>
  <script type="module" src="assets/js/booking/manage.js"></script>
</body>
</html>
