<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Confirm Your Account | Rebel Ranch Ministries</title>

  <style>
    :root {
      --cream: #fff7ea;
      --ink: #2f2933;
      --muted: #6e6871;
      --purple: #5b258f;
      --purple-dark: #43166f;
      --teal: #008d99;
      --pink: #e64f86;
      --white: #ffffff;
      --line: rgba(91, 37, 143, 0.18);
      --success-bg: #e8f8ef;
      --success-text: #17663f;
      --error-bg: #fff0f2;
      --error-text: #97213f;
      --shadow: 0 22px 65px rgba(47, 41, 51, 0.15);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      background:
        radial-gradient(
          circle at top left,
          rgba(230, 79, 134, 0.15),
          transparent 35%
        ),
        radial-gradient(
          circle at bottom right,
          rgba(0, 141, 153, 0.15),
          transparent 35%
        ),
        var(--cream);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    .confirmation-card {
      width: min(100%, 650px);
      padding: clamp(28px, 6vw, 52px);
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--teal);
      font-size: 0.82rem;
      font-weight: 900;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 18px;
      color: var(--purple);
      font-size: clamp(2.4rem, 8vw, 4.7rem);
      line-height: 0.98;
      letter-spacing: -0.04em;
    }

    .message {
      margin: 0;
      color: var(--muted);
      font-size: 1.04rem;
      line-height: 1.7;
    }

    .status-box {
      margin-top: 28px;
      padding: 18px;
      border-left: 5px solid var(--purple);
      background: #f3eef9;
      text-align: left;
      line-height: 1.6;
    }

    .status-box.success {
      border-color: var(--success-text);
      background: var(--success-bg);
      color: var(--success-text);
    }

    .status-box.error {
      border-color: var(--error-text);
      background: var(--error-bg);
      color: var(--error-text);
    }

    .actions {
      display: none;
      margin-top: 28px;
    }

    .actions.visible {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    .action-link {
      display: inline-block;
      padding: 13px 18px;
      border: 2px solid var(--purple);
      border-radius: 8px;
      color: var(--purple);
      font-weight: 900;
      text-decoration: none;
    }

    .action-link.primary {
      background: var(--purple);
      color: var(--white);
    }

    .action-link:hover,
    .action-link:focus-visible {
      background: var(--purple-dark);
      border-color: var(--purple-dark);
      color: var(--white);
    }

    .footer-note {
      margin: 30px 0 0;
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <main class="confirmation-card">
    <p class="eyebrow">Rebel Ranch Ministries Platform</p>

    <h1>Email Confirmation</h1>

    <p class="message">
      We are securely confirming your Rebel Ranch Ministries account.
    </p>

    <div
      id="status"
      class="status-box"
      role="status"
      aria-live="polite"
    >
      Finishing your email confirmation...
    </div>

    <div id="actions" class="actions">
      <a class="action-link primary" href="account.html">
        Continue to My Account
      </a>

      <a class="action-link" href="index.html">
        Return Home
      </a>
    </div>

    <p class="footer-note">
      Rebel Ranch Ministries · Faith, Family &amp; Freedom
    </p>
  </main>

  <script type="module">
  import { supabase } from "./assets/js/supabase-client.js";

  const statusBox = document.getElementById("status");
  const actions = document.getElementById("actions");

  function showResult(message, type = "") {
    statusBox.textContent = message;
    statusBox.className = `status-box ${type}`.trim();
    actions.classList.add("visible");
  }

  async function waitForSession() {
    for (let attempt = 0; attempt < 20; attempt += 1) {
      const { data, error } = await supabase.auth.getSession();

      if (error) {
        throw error;
      }

      if (data.session?.user) {
        return data.session;
      }

      await new Promise((resolve) => {
        setTimeout(resolve, 100);
      });
    }

    return null;
  }

  async function finishConfirmation() {
    try {
      const currentUrl = new URL(window.location.href);
      const searchParameters = currentUrl.searchParams;

      const hashParameters = new URLSearchParams(
        currentUrl.hash.replace(/^#/, "")
      );

      const returnedError =
        searchParameters.get("error_description") ||
        hashParameters.get("error_description");

      if (returnedError) {
        throw new Error(returnedError);
      }

      const authorizationCode =
        searchParameters.get("code");

      const hasImplicitTokens =
        Boolean(hashParameters.get("access_token")) &&
        Boolean(hashParameters.get("refresh_token"));

      if (!authorizationCode && !hasImplicitTokens) {
        showResult(
          "This page is available, but no email-confirmation link was detected. Use the confirmation link sent to your email, or continue to the account page.",
          ""
        );

        return;
      }

      if (authorizationCode) {
        const { error: exchangeError } =
          await supabase.auth.exchangeCodeForSession(
            authorizationCode
          );

        if (exchangeError) {
          throw exchangeError;
        }
      }

      const session = await waitForSession();

      if (!session?.user) {
        throw new Error(
          "The confirmation link was received, but a secure account session could not be established."
        );
      }

      const { data: userData, error: userError } =
        await supabase.auth.getUser();

      if (userError) {
        throw userError;
      }

      if (!userData.user) {
        throw new Error(
          "The confirmed account could not be verified."
        );
      }

      history.replaceState(
        {},
        document.title,
        window.location.pathname
      );

      showResult(
        "Your email has been confirmed and your Rebel Ranch Ministries account is ready. Continue to your account dashboard.",
        "success"
      );
    } catch (error) {
      showResult(
        error?.message ||
          "This confirmation link could not be completed. It may have expired or already been used.",
        "error"
      );
    }
  }

  finishConfirmation();
</script>
</body>
</html>
