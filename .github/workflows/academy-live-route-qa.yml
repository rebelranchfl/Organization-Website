name: Academy Review Candidate QA

on:
  push:
    branches:
      - academy-production-work
    paths:
      - '.github/workflows/academy-live-route-qa.yml'
      - 'rebel ranch academy/content-library/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  water-review-candidate-qa:
    if: github.ref_name == 'academy-production-work'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Academy work branch
        uses: actions/checkout@v6

      - name: Verify candidate files exist
        shell: bash
        run: |
          set -euo pipefail
          base='rebel ranch academy/content-library/sustainability-agriculture/purifying-water-natural-materials/visual-production'
          test -s "$base/water-learning-experience-final.html"
          test -s "$base/water-system-visual-preview.html"
          test -s "$base/water-system-implementation-visuals.html"
          test -s "$base/index.html"
          test -s "$base/preview-manifest.json"
          test -s "$base/assets/generated/water-55gal-layered-filter-v1.webp"
          echo 'WATER_CANDIDATE_FILES_PRESENT'

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Start local review server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/academy-review-server.log 2>&1 &
          echo $! > /tmp/academy-review-server.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/academy-review-server.log
          exit 1

      - name: Exercise Water learner journey and exact return-state behavior
        run: |
          cat > /tmp/academy-water-qa.mjs <<'JS'
          import { chromium } from 'playwright';
          const root='http://127.0.0.1:8000/rebel%20ranch%20academy/content-library/sustainability-agriculture/purifying-water-natural-materials/visual-production/';
          const main=root+'water-learning-experience-final.html';
          const browser=await chromium.launch({headless:true});
          const failures=[];
          const assert=(condition,message)=>{if(!condition)failures.push(message)};

          async function inspect(page,label){
            const broken=await page.locator('img').evaluateAll(xs=>xs.filter(x=>!x.complete||x.naturalWidth===0).length);
            const overflow=await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+2);
            const text=(await page.locator('body').innerText()).trim();
            assert(text.length>100,`${label}: page content is unexpectedly empty`);
            assert(broken===0,`${label}: ${broken} broken image(s)`);
            assert(!overflow,`${label}: document-level horizontal overflow`);
          }

          const page=await browser.newPage({viewport:{width:1440,height:1000}});
          const consoleErrors=[];
          page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
          let res=await page.goto(main,{waitUntil:'networkidle',timeout:45000});
          assert(Boolean(res)&&res.status()<400,'main candidate did not load successfully');

          await page.locator('input[name="source"][value="well"]').check({force:true});
          for(const value of ['drink','animal','emergency']) await page.locator(`input[name="use"][value="${value}"]`).check({force:true});
          await page.locator('input[name="tested"][value="lab"]').check({force:true});
          await page.locator('#concern').selectOption('microbial');
          await page.locator('#scale').selectOption('farm');
          await page.locator('#myplan').scrollIntoViewIfNeeded();

          const branches=await page.locator('#branch-list .branch').count();
          assert(branches===3,`expected 3 personalized branches, found ${branches}`);
          const stored=await page.evaluate(()=>JSON.parse(localStorage.getItem('rra-water-plan-v3')||'{}'));
          assert(stored.source==='well','saved source was not well');
          assert(Array.isArray(stored.uses)&&['drink','animal','emergency'].every(x=>stored.uses.includes(x)),'saved uses did not preserve all three selected uses');
          assert(stored.tested==='lab','saved testing state was not lab');
          assert(stored.concern==='microbial','saved concern was not microbial');
          assert(stored.scale==='farm','saved scale was not farm');

          await page.evaluate(()=>{location.hash='system'});
          await page.locator('#system a[href="water-system-visual-preview.html"]').click();
          await page.waitForURL(/water-system-visual-preview\.html/);
          assert(page.url().endsWith('water-system-visual-preview.html'),'decision visual route did not open');
          await inspect(page,'decision visual');
          await page.locator('#return-link').click();
          await page.waitForURL(/water-learning-experience-final\.html#system$/);
          assert(page.url().endsWith('water-learning-experience-final.html#system'),'decision visual did not return to exact #system location');
          assert(await page.locator('input[name="source"][value="well"]').isChecked(),'source state was lost after decision visual round trip');
          for(const value of ['drink','animal','emergency']) assert(await page.locator(`input[name="use"][value="${value}"]`).isChecked(),`use ${value} was lost after decision visual round trip`);
          assert(await page.locator('#branch-list .branch').count()===3,'personalized branches were lost after decision visual round trip');

          await page.evaluate(()=>{location.hash='use'});
          const scaleDetails=page.locator('#use details.depth');
          await scaleDetails.locator('summary').click();
          await scaleDetails.locator('a[href="water-system-implementation-visuals.html#scale"]').click();
          await page.waitForURL(/water-system-implementation-visuals\.html#scale$/);
          assert(page.url().endsWith('water-system-implementation-visuals.html#scale'),'implementation scale route did not open at #scale');
          await inspect(page,'implementation visual');
          await page.locator('#return-link').click();
          await page.waitForURL(/water-learning-experience-final\.html#use$/);
          assert(page.url().endsWith('water-learning-experience-final.html#use'),'implementation visual did not return to exact #use location');
          assert(await page.locator('#branch-list .branch').count()===3,'personalized branches were lost after implementation visual round trip');

          await inspect(page,'desktop main candidate after round trips');
          assert(consoleErrors.length===0,`console errors: ${consoleErrors.join(' | ')}`);
          await page.close();

          const mobile=await browser.newPage({viewport:{width:390,height:844}});
          res=await mobile.goto(main,{waitUntil:'networkidle',timeout:45000});
          assert(Boolean(res)&&res.status()<400,'mobile candidate did not load successfully');
          await inspect(mobile,'mobile main candidate');
          await mobile.close();

          const image=await browser.newPage({viewport:{width:900,height:1000}});
          res=await image.goto(root+'assets/generated/water-55gal-layered-filter-v1.html',{waitUntil:'networkidle',timeout:45000});
          assert(Boolean(res)&&res.status()<400,'generated image wrapper did not load successfully');
          await inspect(image,'generated Water image');
          await image.close();

          await browser.close();
          if(failures.length){console.error(failures.join('\n'));process.exit(1)}
          console.log('WATER_REVIEW_CANDIDATE_QA_PASS');
          JS
          node /tmp/academy-water-qa.mjs

      - name: Stop local review server
        if: always()
        run: |
          if test -f /tmp/academy-review-server.pid; then kill "$(cat /tmp/academy-review-server.pid)" || true; fi
