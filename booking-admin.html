<link rel="stylesheet" href="assets/css/brand-tokens.css"><link rel="stylesheet" href="assets/css/public-surface.css">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#15331d;color:var(--rrm-ink);font-family:Arial,Helvetica,sans-serif}a{color:inherit}button,textarea,input,select{font:inherit}main{width:min(1280px,94vw);margin:auto;padding:40px 0 80px}.topbar{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;flex-wrap:wrap}.eyebrow{margin:0 0 8px;color:var(--rrm-gold-bright);font-size:.8rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase}h1{margin:0;font-size:clamp(2.1rem,5vw,4rem);line-height:1}.intro{color:var(--rrm-muted);line-height:1.55}.back-link{padding:11px 15px;border-radius:8px;border:1px solid #3b5a40;text-decoration:none;font-weight:800;background:#1d4024}.notice{display:none;margin:20px 0;padding:15px 17px;border-left:5px solid var(--rrm-gold);background:#1d4024;border-radius:8px}.notice.visible{display:block}.notice.error{border-left-color:#c96f5b}.notice.success{border-left-color:#97c459}.panel{margin-top:24px;padding:24px;border:1px solid #315239;border-radius:16px;background:linear-gradient(180deg,#1d4024,#122a18);box-shadow:var(--rrm-shadow)}.panel h2{margin:0 0 8px}.panel h3{margin:18px 0 8px}.muted{color:var(--rrm-muted)}
.rows{display:grid;gap:12px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px;border:1px solid #3b5a40;border-radius:12px;background:#18351f}
.row-title{font-weight:850;line-height:1.3}
.row-detected{margin-top:3px;color:var(--rrm-muted);font-size:.78rem}
.row-controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:flex-end}
.field{display:flex;flex-direction:column;gap:4px;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--rrm-muted)}
.field select,.field input,.field textarea{padding:8px 10px;border:1px solid #45634a;border-radius:7px;background:#102718;color:var(--rrm-ink);min-width:0;text-transform:none;letter-spacing:0;font-weight:400;font-size:1rem}
.field textarea{min-height:90px;resize:vertical}
.check{display:flex;align-items:center;gap:6px;font-size:.78rem;font-weight:800;color:var(--rrm-ink);text-transform:none;letter-spacing:0}
.check input{width:17px;height:17px}
.row-status{font-size:.72rem;font-weight:800;min-width:52px;text-align:center}
.row-status.saved{color:#97c459}.row-status.error{color:#c96f5b}.row-status.saving{color:#f2d38b}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
.tab,.btn{padding:10px 14px;border-radius:8px;border:1px solid #3b5a40;background:#1d4024;color:var(--rrm-ink);font-weight:800;cursor:pointer}
.tab[aria-selected="true"]{border-color:var(--rrm-gold);background:linear-gradient(135deg,var(--rrm-gold),var(--rrm-gold-dark));color:#fff7de}
.btn.primary{border-color:var(--rrm-gold);background:linear-gradient(135deg,var(--rrm-gold),var(--rrm-gold-dark));color:#fff7de}
.btn.danger{border-color:#c96f5b;background:#3a1d17}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.tab:focus-visible{outline:3px solid var(--rrm-gold-bright);outline-offset:2px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:12px}
.form-grid .wide{grid-column:1/-1}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.legal-note{margin:12px 0 0;padding:12px 14px;border-left:5px solid var(--rrm-gold-bright);background:#18351f;border-radius:8px}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{padding:9px 8px;border-bottom:1px solid #315239;text-align:left;vertical-align:top;font-size:.92rem}
th{color:var(--rrm-muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.04em}
.table-wrap{overflow-x:auto}
.detail{margin-top:12px;padding:16px;border:1px solid #3b5a40;border-radius:12px;background:#18351f}
.detail dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 14px;margin:0}
.detail dt{color:var(--rrm-muted);font-weight:800}
.detail dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.version{padding:10px 0;border-top:1px solid #315239}
.version:first-child{border-top:0}
.version pre{white-space:pre-wrap;font-family:inherit;margin:6px 0 0;color:var(--rrm-muted)}
.hidden{display:none!important}
@media(max-width:820px){.row{grid-template-columns:minmax(0,1fr)}.row-controls{justify-content:flex-start}.detail dl{grid-template-columns:1fr}}
</style>
</head>
<body><main>
<div class="topbar"><div><p class="eyebrow">Rebel Ranch Ministries • Owner Control</p><h1>Booking Admin</h1><p class="intro">Set up what visitors can book, when you're open, and which waivers and forms they must complete. Review, export, and cancel bookings.</p></div><a class="back-link" href="account.html">Back to My Account</a></div>
<div id="notice" class="notice" role="status" aria-live="polite"></div>

<div id="content" class="hidden">
  <div class="tabs" role="tablist" aria-label="Booking admin sections">
    <button class="tab" role="tab" id="tab-settings" aria-controls="panel-settings" aria-selected="true">Settings</button>
    <button class="tab" role="tab" id="tab-types" aria-controls="panel-types" aria-selected="false" tabindex="-1">Visit Types</button>
    <button class="tab" role="tab" id="tab-hours" aria-controls="panel-hours" aria-selected="false" tabindex="-1">Weekly Hours</button>
    <button class="tab" role="tab" id="tab-blocked" aria-controls="panel-blocked" aria-selected="false" tabindex="-1">Blocked Dates</button>
    <button class="tab" role="tab" id="tab-waivers" aria-controls="panel-waivers" aria-selected="false" tabindex="-1">Waivers &amp; Forms</button>
    <button class="tab" role="tab" id="tab-bookings" aria-controls="panel-bookings" aria-selected="false" tabindex="-1">Bookings</button>
  </div>
  <section class="panel" role="tabpanel" id="panel-settings" aria-labelledby="tab-settings"></section>
  <section class="panel hidden" role="tabpanel" id="panel-types" aria-labelledby="tab-types"></section>
  <section class="panel hidden" role="tabpanel" id="panel-hours" aria-labelledby="tab-hours"></section>
  <section class="panel hidden" role="tabpanel" id="panel-blocked" aria-labelledby="tab-blocked"></section>
  <section class="panel hidden" role="tabpanel" id="panel-waivers" aria-labelledby="tab-waivers"></section>
  <section class="panel hidden" role="tabpanel" id="panel-bookings" aria-labelledby="tab-bookings"></section>
</div>
</main>
<script type="module" src="assets/js/booking/admin.js"></script>

</html>
