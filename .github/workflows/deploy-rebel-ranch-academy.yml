name: Deploy Rebel Ranch Academy

on:
  pull_request:
    branches:
      - main
    paths:
      - "rebel ranch academy/Rebel-Ranch-Academy-Program-Hub/**"
      - ".github/workflows/deploy-rebel-ranch-academy.yml"
  push:
    branches:
      - main
    paths:
      - "rebel ranch academy/Rebel-Ranch-Academy-Program-Hub/**"
      - ".github/workflows/deploy-rebel-ranch-academy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rebel-ranch-academy-${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
  cancel-in-progress: true

jobs:
  build-test-deploy:
    name: Build, test, and deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rebel ranch academy/Rebel-Ranch-Academy-Program-Hub

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rebel ranch academy/Rebel-Ranch-Academy-Program-Hub/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm test

      - name: Deploy private preview
        if: github.event_name == 'pull_request'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.92.0"
          workingDirectory: rebel ranch academy/Rebel-Ranch-Academy-Program-Hub
          command: deploy --config dist/server/wrangler.json --name rebel-ranch-academy-preview

      - name: Deploy public Academy site
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.92.0"
          workingDirectory: rebel ranch academy/Rebel-Ranch-Academy-Program-Hub
          command: deploy --config dist/server/wrangler.json --name rebel-ranch-academy --domain academy.rebelranchministries.org
