<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Membership Status | Rebel Ranch Ministries</title>
<style>body{margin:0;background:#fff7ea;color:#2f2933;font-family:Arial,sans-serif}main{max-width:720px;margin:60px auto;padding:30px;background:#fff;border-radius:18px;box-shadow:0 15px 45px rgba(47,41,51,.12)}h1{color:#43166f}.status{padding:16px;border-radius:12px;background:#f3eef9}a{color:#5b258f}</style></head>
<body><main><h1>Membership Status</h1><div id="membership" class="status">Checking your membership…</div>
<p><a href="creation-station-membership.html">View membership options</a> · <a href="account.html">My Account</a></p></main>
<script type="module">
import { supabase } from "./assets/js/supabase-client.js";
const panel=document.getElementById("membership");
const {data:{user}}=await supabase.auth.getUser();
if(!user){panel.textContent="Sign in to view your membership status."}
else{
 const {data,error}=await supabase.from("memberships").select("status,starts_at,ends_at,cancel_at_period_end").eq("user_id",user.id).eq("program_code","creation_station").order("created_at",{ascending:false}).limit(1).maybeSingle();
 if(error) panel.textContent="We could not load your membership right now.";
 else if(!data) panel.textContent="No Creation Station membership is connected to this account.";
 else {
   const through=data.ends_at?new Date(data.ends_at).toLocaleDateString():null;
   panel.textContent=data.cancel_at_period_end&&through?`Active through ${through}; cancellation is scheduled.`:data.status==="past_due"&&through?`Payment needs attention. Access remains available through ${through}.`:`Membership status: ${data.status}.`;
 }
}
</script></body></html>
