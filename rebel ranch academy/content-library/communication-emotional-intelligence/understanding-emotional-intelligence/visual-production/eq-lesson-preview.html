<script type="module">

// Loaded dynamically and defensively: the reading experience (navigation, content,

// blocked, or fails outright. A static top-level import would abort the entire

const GLOSSARY = {
  'ability': 'Something you can get better at with practice — not a fixed personality type.',
  'meta-analysis': 'A study that combines the results of many other studies to find the most reliable overall answer, instead of trusting just one.',
  'reappraisal': 'Changing how you think about a situation before the feeling fully takes over.',
  'suppression': 'Feeling something fully but bottling up the outward reaction to it.',
  'deviation-iq': 'The modern way IQ is scored: your result compared to other people your age, on a scale fixed to an average of 100.'
};

// Numbered to match sources.md exactly, so an inline footnote and the full table
// at the end of the lesson always point to the same source under the same number.
const FOOTNOTES = {
  1: { title: 'Salovey & Mayer, 1990 — original EI definition', url: 'https://journals.sagepub.com/doi/10.2190/DUGG-P24E-52WK-6CDG' },
  2: { title: 'Mayer, Salovey & Caruso — four-branch model', url: 'https://cdn2.psychologytoday.com/assets/attachments/1575/rp2008-mayersaloveycarusob.pdf' },
  3: { title: 'APA Dictionary of Psychology — emotional intelligence', url: 'https://dictionary.apa.org/emotional-intelligence' },
  4: { title: 'Goleman, 1995 — popularization, labeled as such', url: 'https://en.wikipedia.org/wiki/Emotional_Intelligence' },
  5: { title: 'Locke, 2005 — academic critique', url: 'https://onlinelibrary.wiley.com/doi/10.1002/job.318' },
  6: { title: 'Joseph & Newman, 2010 — meta-analysis', url: 'https://workplaceinsight.net/wp-content/uploads/2018/03/JosephNewman2010.pdf' },
  7: { title: 'Thorndike, 1920 — social intelligence', url: 'https://archive.org/stream/thorndike-e.-1920.-intelligence-and-its-use.-harpers-magazine/Thorndike,%20E.(1920).%20Intelligence%20and%20its%20use.%20Harper%27s%20Magazine,_djvu.txt' },
  8: { title: 'Gardner, 1983 — Frames of Mind', url: 'https://books.google.com/books/about/Frames_of_Mind.html?id=ObgOAAAAQAAJ' },
  9: { title: 'Gross, 1998 — reappraisal vs. suppression', url: 'https://journals.sagepub.com/doi/10.1037/1089-2680.2.3.271' },
  10: { title: 'Yale Center for Emotional Intelligence — RULER + independent RCT', url: 'https://rulerapproach.org/' },
  11: { title: 'IQ / deviation-IQ reference definition', url: 'https://dictionary.apa.org/deviation-iq' }
};

const ICONS = {
  perceive: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#8a5a00" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>',
  use: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#8a5a00" stroke-width="1.8"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.6.6 1 1.4 1 2.5h6c0-1.1.4-1.9 1-2.5A6 6 0 0 0 12 3z"/></svg>',
  understand: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#8a5a00" stroke-width="1.8"><circle cx="9" cy="12" r="6"/><circle cx="15" cy="12" r="6"/></svg>',
  manage: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#8a5a00" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M15 9l-2 6-6 2 2-6 6-2z"/></svg>',
  book: '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#0d1b2e" stroke-width="1.6"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H12v18H6.5A2.5 2.5 0 0 1 4 18.5v-13z"/><path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H12v18h5.5a2.5 2.5 0 0 0 2.5-2.5v-13z"/></svg>',
  heart: '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#0d1b2e" stroke-width="1.6"><path d="M12 20s-7-4.35-9.5-8.5C.5 8 2.5 4.5 6 4.5c2 0 3.5 1.2 4 2.3.5-1.1 2-2.3 4-2.3 3.5 0 5.5 3.5 3.5 7C19 15.65 12 20 12 20z"/></svg>'
};

function fn(n){ return `<sup class="fn" data-fn="${n}">[${n}]</sup>`; }

const sections = [
  { id:'hook', title:null, tocLabel:'Start', body:`
    <p style="font-size:1.05rem">Someone cuts you off in traffic, or a coworker takes credit for your idea, or your kid melts down in the grocery store. In the space of about two seconds, you're going to do one of two things: react on the raw feeling, or do something with it first. Most people never learned there's a difference — or that the difference is something you can actually get better at.</p>
    <p>That "something" has a name: <strong>emotional intelligence.</strong></p>` },

  { id:'core', title:'What it actually is', body:`
    <p>In 1990, psychologists Peter Salovey and John Mayer gave this idea its first real, testable definition${fn(1)}: <strong>the <span class="term" data-term="ability">ability</span> to monitor your own and other people's feelings, tell them apart accurately, and use that information to guide what you think and do next.</strong> They and a colleague, David Caruso, later broke it into four specific abilities${fn(2)}.</p>
    <ol>
      <li><strong>Perceive</strong> — accurately notice emotion: in a face, a tone of voice, a slumped posture, or in yourself.</li>
      <li><strong>Use</strong> — let the right mood do the right job.</li>
      <li><strong>Understand</strong> — know how emotions move and change.</li>
      <li><strong>Manage</strong> — sit with a feeling long enough to learn something from it, then choose your next move.</li>
    </ol>
    <img src="https://raw.githubusercontent.com/rebelranchfl/Organization-Website/claude/funny-shannon-9nq3h4/rebel%20ranch%20academy/content-library/communication-emotional-intelligence/understanding-emotional-intelligence/illustrations/eq-four-abilities-diagram.png" alt="The four abilities of emotional intelligence: Perceive, Use, Understand, and Manage.">
    <button class="expand-toggle" data-panel="core-deeper" aria-expanded="false">Go deeper: how these four were verified →</button>
    <div class="expand-panel" id="panel-core-deeper">
      <p>Both the wording and the connections in this diagram were independently checked against the actual research (not just generated and trusted): each label matches Salovey &amp; Mayer's four-branch model exactly, and the connecting arrows were confirmed to show the abilities as related to each other rather than a strict one-way order — which is what the research actually supports.</p>
    </div>` },

  { id:'iqeq', title:'IQ vs. EQ', tocLabel:'IQ vs. EQ', body:`
    <p>Almost every article about emotional intelligence tells you it's "not the same as IQ" without ever saying what IQ actually is. That's backwards — you can't judge a comparison you were only shown one side of.</p>
    <p><strong>IQ (intelligence quotient)</strong> is a standardized score meant to measure analytical reasoning: how well you solve unfamiliar problems, hold information in working memory, spot patterns, and reason with language and numbers. The modern version, introduced by psychologist David Wechsler in 1939, is a <span class="term" data-term="deviation-iq">deviation IQ</span>${fn(11)} — it scores you against other people your age on a scale fixed to an average of 100. It replaced the older method (mental age ÷ actual age × 100), which broke down badly once you were an adult.</p>
    <p>Here's the part that matters for this lesson: <strong>IQ tests were never designed to measure how well you read a room, manage a strong feeling, or handle another person's emotions.</strong> That's not a flaw in the test — it's just not what it's for. This is the same gap Edward Thorndike pointed out in 1920${fn(7)}, long before "EQ" existed as a term: he noticed that the kind of smart that gets you a top score on an academic test and the kind of smart that gets you through a tense conversation are not the same skill, and called the second one <em>social intelligence</em>.</p>
    <div class="compare-grid">
      <div class="compare-card">
        <h4>${ICONS.book} IQ — "book smart"</h4>
        <ul>
          <li>Measures analytical/logical reasoning</li>
          <li>Scored against your age group, average = 100</li>
          <li>A brilliant analyst who shuts down when a teammate pushes back</li>
        </ul>
      </div>
      <div class="compare-card">
        <h4>${ICONS.heart} EQ — "people smart"</h4>
        <ul>
          <li>Measures reading and managing emotion — yours and others'</li>
          <li>No single standardized scale like IQ's</li>
          <li>The classmate with an average test score who calms down a room in a minute</li>
        </ul>
      </div>
    </div>
    <p>Neither person above is "smarter" in some overall sense — they're strong in <em>different</em> abilities, and most jobs and relationships need some of both. The 2010 meta-analysis you'll see later in this lesson found ability-based EI predicts job performance well in high-people-contact work — teaching, nursing, customer service, management — and matters less, or can even slow you down, in fast, narrowly technical work where there isn't time for it.</p>
    <div class="callout"><strong>Book smart vs. people smart, in plain terms:</strong> book smart (closer to IQ) is how fast and accurately you process information and solve a problem on paper. People smart (closer to EQ) is how accurately you read what's happening in and between people, and what you do with that in the moment. Being high in one tells you very little about the other.</div>` },

  { id:'history', title:'Where this idea came from', body:`
    <p>This isn't a modern invention out of nowhere, and it isn't ancient wisdom either — it sits right in between. Thorndike's 1920 observation didn't stay unanswered for long: in 1983, Howard Gardner's theory of multiple intelligences${fn(8)} split "social intelligence" further into <em>interpersonal</em> intelligence (reading other people) and <em>intrapersonal</em> intelligence (reading yourself). Salovey and Mayer took that century of observation and finally gave it something researchers could actually test.</p>` },

  { id:'myth', title:'The part most people get wrong', body:`
    <p>In 1995, Daniel Goleman wrote a bestselling book that made "EQ" a household phrase${fn(4)} — and claimed it could matter <em>more than IQ</em>. That book used a much broader definition than Salovey and Mayer's original one.</p>
    <p>Ten years later, psychologist Edwin Locke published a pointed rebuttal${fn(5)}: once you define "emotional intelligence" that broadly, he argued, it stops meaning anything specific.</p>
    <p>The most useful answer comes from a 2010 <span class="term" data-term="meta-analysis">meta-analysis</span> by Dana Joseph and Daniel Newman${fn(6)}: <strong>ability-based EI predicts job performance inconsistently</strong> — it helps in high emotional-labor jobs, and can slow you down in fast, technical ones.</p>
    <div class="callout"><strong>The honest takeaway:</strong> emotional intelligence is real and learnable. Whether it deserves to be called an "intelligence" is a legitimate, unsettled argument — that doesn't make the skills useless.</div>` },

  { id:'technique', title:'The one technique that’s actually been tested', body:`
    <p>Psychologist James Gross studied two ways people handle a strong feeling in the moment${fn(9)}: <span class="term" data-term="reappraisal">reappraisal</span> and <span class="term" data-term="suppression">suppression</span>.</p>
    <p>The results aren't close. <strong>Reappraisal</strong> lowers the felt emotion, doesn't damage memory, and doesn't raise stress in others. <strong>Suppression</strong> does not lower the felt emotion, does damage memory, and does raise stress in everyone involved.</p>
    <img src="https://raw.githubusercontent.com/rebelranchfl/Organization-Website/claude/funny-shannon-9nq3h4/rebel%20ranch%20academy/content-library/communication-emotional-intelligence/understanding-emotional-intelligence/illustrations/eq-reappraisal-vs-suppression-comparison.png" alt="Reappraisal lowers felt emotion, does not damage memory, does not raise stress on others. Suppression does not lower felt emotion, damages memory, raises stress on others.">
    <button class="expand-toggle" data-panel="tech-deeper" aria-expanded="false">Go deeper: the easiest place this gets drawn wrong →</button>
    <div class="expand-panel" id="panel-tech-deeper">
      <p>The riskiest mistake in an image like this is showing suppression as "working, but with a downside." It doesn't lower the felt emotion at all — that was checked specifically against the actual pixels before this image was accepted, not assumed from the brief alone.</p>
    </div>` },

  { id:'activity', title:'Try It — Match &amp; Check', tocLabel:'Try It — Match & Check', body:`
    <p>Two quick checks, no essay required.</p>
    <h3>Part A — Match each ability to what it looks like in real life</h3>
    <p class="match-instructions">Click one ability on the left, then click the description on the right that matches it. A correct pair turns green and locks in; a wrong pair flashes red so you can try again.</p>
    <div class="match-wrap" id="matchWrap">
      <div class="match-col">
        <button type="button" class="match-pill" data-ability="perceive">Perceive</button>
        <button type="button" class="match-pill" data-ability="use">Use</button>
        <button type="button" class="match-pill" data-ability="understand">Understand</button>
        <button type="button" class="match-pill" data-ability="manage">Manage</button>
      </div>
      <div class="match-col">
        <button type="button" class="match-pill" data-match="manage">Waiting ten seconds before responding to a text that upset you, instead of firing back immediately.</button>
        <button type="button" class="match-pill" data-match="perceive">Noticing a coworker's jaw tighten right before they say "I'm fine."</button>
        <button type="button" class="match-pill" data-match="use">Feeling a little nervous energy before a presentation and using it to sound alert instead of flat.</button>
        <button type="button" class="match-pill" data-match="understand">Realizing your frustration at a slow driver is really about being late, not about the driver.</button>
      </div>
    </div>
    <p class="match-status" id="matchStatus">0 of 4 matched.</p>
    <div class="match-success" id="matchSuccess">🎉 All four matched — nice work!</div>

    <h3>Part B — Spot the reappraisal</h3>
    <p>Which of these are examples of <strong>reappraisal</strong> (not suppression)? Check all that apply.</p>
    <div id="reappraisalCheck">
      <label class="check-row"><input type="checkbox" data-correct="true"> "Someone criticizes your work in front of others. You think: 'They're stressed about the deadline too, this probably isn't really about me,' and the sting fades a little."</label>
      <label class="check-row"><input type="checkbox" data-correct="false"> "Someone criticizes your work in front of others. You feel furious but keep a completely flat, calm face the rest of the meeting."</label>
      <label class="check-row"><input type="checkbox" data-correct="true"> "Your flight gets cancelled. You think: 'This is annoying, but it also means I get an extra night to prepare for tomorrow's meeting,' and your frustration eases a little."</label>
      <label class="check-row"><input type="checkbox" data-correct="false"> "Your flight gets cancelled. You're seething, but you smile and tell the gate agent 'no worries, it happens.'"</label>
      <label class="check-row"><input type="checkbox" data-correct="false"> "You reread a friend's short text three times, decide it definitely means they're mad at you, and spend the day irritated."</label>
      <label class="check-row"><input type="checkbox" data-correct="true"> "A teammate takes credit for your idea in a meeting. Afterward, you think: 'They probably didn't even realize it was mine — I'll just mention it privately after,' and the anger drops enough to speak calmly later."</label>
    </div>
    <button type="button" class="action-btn" id="checkAnswersBtn">Check My Answers</button>
    <p class="check-result" id="checkResult"></p>
    <div class="save-status" id="saveStatus"></div>` },

  { id:'further', title:'Take it further', body:`
    <p>Yale's Center for Emotional Intelligence built a five-step version of this idea called RULER${fn(10)}: Recognize, Understand, Label, Express, Regulate — tested with thousands of students, showing more emotionally supportive classrooms where it's used. This lesson's activity borrows the same structure without claiming to deliver the full licensed program.</p>` },

  { id:'transfer', title:'REBEL RANCH PRINCIPLE', body:`
    <p>Every Rebel Ranch Academy lesson ends with a section by this name. It's simple: take what you learn and use it. Knowledge doesn't stay in one place — it applies in different situations across your whole life. Here's this lesson's version:</p>
    <blockquote>Naming and understanding an emotion before reacting to it produces a better decision than reacting on the raw feeling.</blockquote>
    <ul>
      <li><strong>Personally</strong> — notice what you're actually feeling before you react, and you make a better call.</li>
      <li><strong>Family</strong> — recognizing overwhelm instead of defiance changes how you respond, and that's what actually calms things down.</li>
      <li><strong>Work and leadership</strong> — you deal with people every day, and you never know what someone's carrying — a bad day, a loss, money trouble. Reading that instead of taking it personally is what good bedside manner and good leadership are built on, and it's why you're usually the first line of conflict resolution before HR gets involved.</li>
      <li><strong>Money and decisions under pressure</strong> — panic, fear, and excitement are emotions too. Naming one before you act beats a decision made purely on the raw feeling.</li>
    </ul>
    <div class="callout"><strong>One honest limit:</strong> reading emotions well doesn't make you right about the facts. You can sense someone's defensive and still be wrong about why.</div>` },

  { id:'quiz', title:'Quick Quiz', tocLabel:'Quick Quiz', body:`
    <p>Five quick questions on what this lesson covered.</p>
    <div id="quizWrap">
      <div class="quiz-q" data-answer="predict">
        <p class="qtext">1. Which of these is NOT one of the four abilities in the Salovey/Mayer/Caruso model?</p>
        <div class="quiz-options">
          <label><input type="radio" name="q1" value="perceive">Perceive</label>
          <label><input type="radio" name="q1" value="predict">Predict</label>
          <label><input type="radio" name="q1" value="use">Use</label>
          <label><input type="radio" name="q1" value="manage">Manage</label>
        </div>
      </div>
      <div class="quiz-q" data-answer="b">
        <p class="qtext">2. The modern "deviation IQ" scale is centered on which numbers?</p>
        <div class="quiz-options">
          <label><input type="radio" name="q2" value="a">Mean 0, standard deviation 1</label>
          <label><input type="radio" name="q2" value="b">Mean 100, standard deviation 15</label>
          <label><input type="radio" name="q2" value="c">Mean 50, standard deviation 10</label>
          <label><input type="radio" name="q2" value="d">There is no standard scale</label>
        </div>
      </div>
      <div class="quiz-q" data-answer="reappraisal">
        <p class="qtext">3. According to Gross (1998), which technique actually lowers the felt emotion?</p>
        <div class="quiz-options">
          <label><input type="radio" name="q3" value="suppression">Suppression</label>
          <label><input type="radio" name="q3" value="reappraisal">Reappraisal</label>
          <label><input type="radio" name="q3" value="both">Both, equally</label>
          <label><input type="radio" name="q3" value="neither">Neither</label>
        </div>
      </div>
      <div class="quiz-q" data-answer="b">
        <p class="qtext">4. According to the 2010 meta-analysis by Joseph &amp; Newman, ability-based EI helps job performance most in...</p>
        <div class="quiz-options">
          <label><input type="radio" name="q4" value="a">Fast, highly technical jobs</label>
          <label><input type="radio" name="q4" value="b">High emotional-labor jobs like teaching, nursing, or customer service</label>
          <label><input type="radio" name="q4" value="c">Every job, equally</label>
          <label><input type="radio" name="q4" value="d">No job — it never helps</label>
        </div>
      </div>
      <div class="quiz-q" data-answer="social">
        <p class="qtext">5. In 1920, Edward Thorndike called the "people smart" skill...</p>
        <div class="quiz-options">
          <label><input type="radio" name="q5" value="emotional">Emotional intelligence</label>
          <label><input type="radio" name="q5" value="general">General intelligence</label>
          <label><input type="radio" name="q5" value="social">Social intelligence</label>
          <label><input type="radio" name="q5" value="multiple">Multiple intelligence</label>
        </div>
      </div>
    </div>
    <button type="button" class="action-btn" id="checkQuizBtn">Check My Answers</button>
    <p class="quiz-score" id="quizScore"></p>` },

  { id:'commit', title:'One Thing To Try', body:`
    <p>Pick one specific moment coming up this week where you know a strong feeling is likely — a hard conversation, a deadline, a disagreement you've been avoiding. Decide right now, and keep it here so you can check back on it.</p>
    <div class="commit-field">
      <label for="commitMoment">What's the moment?</label>
      <input type="text" id="commitMoment" placeholder="e.g. the budget conversation with my manager on Thursday">
    </div>
    <div class="commit-choice">
      <button type="button" class="commit-pill" data-choice="bottle">Bottle it up</button>
      <button type="button" class="commit-pill" data-choice="reappraise">Reappraise it</button>
    </div>
    <button type="button" class="action-btn" id="saveCommitBtn">Save My Answer</button>
    <p class="save-status" id="commitStatus"></p>` },

  { id:'glossary', title:'Glossary', tocLabel:'Glossary', body:`
    <p>Every defined term from this lesson, in one place.</p>
    <dl class="glossary-list">
      <dt>Ability</dt><dd>${'Something you can get better at with practice — not a fixed personality type.'}</dd>
      <dt>Deviation IQ</dt><dd>${'The modern way IQ is scored: your result compared to other people your age, on a scale fixed to an average of 100.'}</dd>
      <dt>Meta-analysis</dt><dd>${'A study that combines the results of many other studies to find the most reliable overall answer, instead of trusting just one.'}</dd>
      <dt>Reappraisal</dt><dd>${'Changing how you think about a situation before the feeling fully takes over.'}</dd>
      <dt>Suppression</dt><dd>${'Feeling something fully but bottling up the outward reaction to it.'}</dd>
    </dl>` },

  { id:'references', title:'References', tocLabel:'References', body:`
    <p>The full, linked source list for every claim in this lesson — including the parts that disagree with each other.</p>
    <div class="callout"><strong>How to read the tag on each source below:</strong> <em>Content confirmed</em> means the specific claim was checked against real material returned by research, not just assumed from a title. <em>Existence confirmed only</em> means we found and linked the real source, but the specific wording inside it was not independently read — treat those claims as well-corroborated, not primary-verified.</div>
    <details class="source"><summary>[1] Salovey &amp; Mayer, 1990 — original EI definition</summary><div class="source-body"><a href="https://journals.sagepub.com/doi/10.2190/DUGG-P24E-52WK-6CDG" target="_blank" rel="noopener">SAGE/DOI</a> · <a href="https://scholars.unh.edu/psych_facpub/450/" target="_blank" rel="noopener">UNH mirror</a>. Primary source. Content confirmed.</div></details>
    <details class="source"><summary>[2] Mayer, Salovey &amp; Caruso — four-branch model</summary><div class="source-body"><a href="https://cdn2.psychologytoday.com/assets/attachments/1575/rp2008-mayersaloveycarusob.pdf" target="_blank" rel="noopener">PDF</a>. Primary source. Content confirmed.</div></details>
    <details class="source"><summary>[3] APA Dictionary of Psychology — institutional reference</summary><div class="source-body"><a href="https://dictionary.apa.org/emotional-intelligence" target="_blank" rel="noopener">dictionary.apa.org</a>. Near-primary source. Content confirmed.</div></details>
    <details class="source"><summary>[4] Goleman, 1995 — popularization, labeled as such</summary><div class="source-body"><a href="https://en.wikipedia.org/wiki/Emotional_Intelligence" target="_blank" rel="noopener">Wikipedia — book article</a>. Secondary source. Existence confirmed only — the book's own text was not independently read.</div></details>
    <details class="source"><summary>[5] Locke, 2005 — academic critique</summary><div class="source-body"><a href="https://onlinelibrary.wiley.com/doi/10.1002/job.318" target="_blank" rel="noopener">Wiley/DOI</a>. Primary source. Content confirmed.</div></details>
    <details class="source"><summary>[6] Joseph &amp; Newman, 2010 — meta-analysis</summary><div class="source-body"><a href="https://workplaceinsight.net/wp-content/uploads/2018/03/JosephNewman2010.pdf" target="_blank" rel="noopener">PDF mirror</a>. Primary source. Content confirmed.</div></details>
    <details class="source"><summary>[7] Thorndike, 1920 — social intelligence</summary><div class="source-body"><a href="https://archive.org/stream/thorndike-e.-1920.-intelligence-and-its-use.-harpers-magazine/Thorndike,%20E.(1920).%20Intelligence%20and%20its%20use.%20Harper%27s%20Magazine,_djvu.txt" target="_blank" rel="noopener">archive.org — full text</a>. Primary source, direct link. Existence confirmed only — the text itself was not independently read.</div></details>
    <details class="source"><summary>[8] Gardner, 1983 — Frames of Mind</summary><div class="source-body"><a href="https://books.google.com/books/about/Frames_of_Mind.html?id=ObgOAAAAQAAJ" target="_blank" rel="noopener">Google Books</a>. Secondary/bibliographic page. Existence confirmed only — the book's own text was not independently read.</div></details>
    <details class="source"><summary>[9] Gross, 1998 — reappraisal vs. suppression</summary><div class="source-body"><a href="https://journals.sagepub.com/doi/10.1037/1089-2680.2.3.271" target="_blank" rel="noopener">SAGE/DOI</a>. Primary source. Content confirmed.</div></details>
    <details class="source"><summary>[10] Yale Center for Emotional Intelligence — RULER + RCT</summary><div class="source-body"><a href="https://rulerapproach.org/" target="_blank" rel="noopener">rulerapproach.org</a> · <a href="https://pg.casel.org/ruler-approach/" target="_blank" rel="noopener">CASEL</a>. Near-primary source + independent RCT. Content confirmed.</div></details>
    <details class="source"><summary>[11] IQ / deviation-IQ reference definition</summary><div class="source-body"><a href="https://dictionary.apa.org/deviation-iq" target="_blank" rel="noopener">APA Dictionary — deviation IQ</a> · <a href="https://dictionary.apa.org/iq" target="_blank" rel="noopener">APA Dictionary — IQ</a>. Reference source. Content confirmed for the core mean-100/SD-15 fact; this sandbox's network access blocked opening these exact pages directly, so the pages themselves are existence-confirmed only.</div></details>` }
];

// A real, always-visible table of contents on the first page -- not just the
// header button/modal, which the owner found easy to miss entirely.
sections[0].body += '<div class="inline-toc"><h3>Contents</h3>' + sections.map((s, i) => {
  const label = s.tocLabel || s.title || 'Start';
  return `<button type="button" class="inline-toc-item" data-idx="${i}">${i+1}. ${label}</button>`;
}).join('') + '</div>';

let current = 0;
let user = null;

const stage = document.getElementById('stage');
const sectionLabel = document.getElementById('sectionLabel');
const percentLabel = document.getElementById('percentLabel');
const progressFill = document.getElementById('progressFill');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const pagerMid = document.getElementById('pagerMid');
const authline = document.getElementById('authline');
const signedOutBanner = document.getElementById('signedOutBanner');
const popover = document.getElementById('popover');
const popoverBody = document.getElementById('popoverBody');
const tocBtn = document.getElementById('tocBtn');
const tocOverlay = document.getElementById('tocOverlay');
const tocList = document.getElementById('tocList');
const tocClose = document.getElementById('tocClose');

function buildToc(){
  tocList.innerHTML = sections.map((s, i) => {
    const label = s.tocLabel || s.title || 'Start';
    return `<button type="button" class="toc-item${i===current?' current':''}" data-idx="${i}">${i+1}. ${label}</button>`;
  }).join('');
  tocList.querySelectorAll('.toc-item').forEach(b => b.addEventListener('click', () => {
    const idx = Number(b.dataset.idx);
    tocOverlay.classList.remove('show');
    if (idx !== current) { const dir = idx > current ? 'right' : 'left'; current = idx; renderSection(current, dir); }
  }));
}
tocBtn.addEventListener('click', () => { buildToc(); tocOverlay.classList.add('show'); });
tocClose.addEventListener('click', () => tocOverlay.classList.remove('show'));
tocOverlay.addEventListener('click', e => { if (e.target === tocOverlay) tocOverlay.classList.remove('show'); });

function showFootnotePopover(target, n){
  const f = FOOTNOTES[n];
  if (!f) return;
  popoverBody.innerHTML = `<strong>[${n}] ${f.title}</strong>` + (f.url ? `<br><a href="${f.url}" target="_blank" rel="noopener">Open source →</a>` : '<br><em>No direct link — see the full References section.</em>');
  positionPopover(target);
}

function positionPopover(target){
  const r = target.getBoundingClientRect();
  popover.style.top = (window.scrollY + r.bottom + 6) + 'px';
  popover.style.left = Math.max(10, Math.min(r.left, window.innerWidth - 296)) + 'px';
  popover.classList.add('show');
}

function renderSection(index, direction){
  const s = sections[index];
  const el = document.createElement('div');
  el.className = 'section ' + (direction === 'left' ? 'enter-left' : direction === 'right' ? 'enter-right' : '');
  el.innerHTML = (s.title ? `<h2>${s.title}</h2>` : '') + s.body;

  stage.replaceChildren(el);
  requestAnimationFrame(()=> requestAnimationFrame(()=> el.classList.add('active')));

  el.querySelectorAll('.term').forEach(t => t.addEventListener('click', e => {
    const def = GLOSSARY[t.dataset.term] || 'Definition not available.';
    popoverBody.innerHTML = `<strong>${t.textContent}</strong><br>${def}`;
    positionPopover(t);
  }));
  el.querySelectorAll('.fn').forEach(f => f.addEventListener('click', e => {
    showFootnotePopover(f, f.dataset.fn);
  }));
  el.querySelectorAll('.expand-toggle').forEach(b => b.addEventListener('click', () => {
    const panel = document.getElementById('panel-' + b.dataset.panel);
    const open = panel.classList.toggle('open');
    b.setAttribute('aria-expanded', String(open));
  }));
  el.querySelectorAll('.inline-toc-item').forEach(b => b.addEventListener('click', () => {
    const idx = Number(b.dataset.idx);
    if (idx !== current) { const dir = idx > current ? 'right' : 'left'; current = idx; renderSection(current, dir); }
  }));
  if (s.id === 'activity') wireActivity(el);
  if (s.id === 'quiz') wireQuiz(el);
  if (s.id === 'commit') wireCommit(el);

  sectionLabel.textContent = `Section ${index+1} of ${sections.length}`;
  const pct = Math.round(((index+1)/sections.length)*100);
  percentLabel.textContent = pct + '%';
  progressFill.style.width = pct + '%';
  pagerMid.textContent = s.tocLabel || s.title || '';
  prevBtn.disabled = index === 0;
  nextBtn.textContent = index === sections.length - 1 ? 'Finish' : 'Next →';

  saveProgress(index, pct);
}

document.getElementById('popoverClose').addEventListener('click', () => popover.classList.remove('show'));
document.addEventListener('click', e => {
  if (!popover.contains(e.target) && !e.target.classList?.contains('term') && !e.target.classList?.contains('fn')) popover.classList.remove('show');
});

prevBtn.addEventListener('click', () => { if (current>0){ current--; renderSection(current,'left'); } });
nextBtn.addEventListener('click', () => { if (current<sections.length-1){ current++; renderSection(current,'right'); } });

let lastAnswers = {};

function wireActivity(container){
  const status = container.querySelector('#saveStatus');
  const matchWrap = container.querySelector('#matchWrap');
  let selectedLeft = null;
  let matchedCount = 0;
  const matchStatus = container.querySelector('#matchStatus');
  const matchSuccess = container.querySelector('#matchSuccess');

  matchWrap.querySelectorAll('[data-ability]').forEach(leftPill => {
    leftPill.addEventListener('click', () => {
      if (leftPill.classList.contains('correct')) return;
      matchWrap.querySelectorAll('[data-ability]').forEach(p => p.classList.remove('selected'));
      leftPill.classList.add('selected');
      selectedLeft = leftPill;
    });
  });
  matchWrap.querySelectorAll('[data-match]').forEach(rightPill => {
    rightPill.addEventListener('click', () => {
      if (rightPill.classList.contains('correct') || !selectedLeft) return;
      if (selectedLeft.dataset.ability === rightPill.dataset.match) {
        selectedLeft.classList.add('correct'); selectedLeft.classList.remove('selected');
        rightPill.classList.add('correct');
        matchedCount++;
        matchStatus.textContent = `${matchedCount} of 4 matched.`;
        if (matchedCount === 4) matchSuccess.classList.add('show');
        selectedLeft = null;
        if (matchedCount === 4) saveActivityAnswers(container);
      } else {
        rightPill.classList.add('wrong');
        setTimeout(() => rightPill.classList.remove('wrong'), 500);
      }
    });
  });

  container.querySelector('#checkAnswersBtn').addEventListener('click', () => {
    const rows = container.querySelectorAll('#reappraisalCheck .check-row');
    let correctCount = 0;
    rows.forEach(row => {
      const box = row.querySelector('input');
      const isCorrect = box.dataset.correct === 'true';
      row.classList.remove('correct','incorrect','missed');
      if (box.checked && isCorrect) { row.classList.add('correct'); correctCount++; }
      else if (box.checked && !isCorrect) { row.classList.add('incorrect'); }
      else if (!box.checked && isCorrect) { row.classList.add('missed'); }
    });
    container.querySelector('#checkResult').textContent = `You correctly identified ${correctCount} of 3 reappraisal examples.`;
    saveActivityAnswers(container);
  });

  function saveActivityAnswers(scope){
    const matching_complete = matchedCount === 4;
    const reappraisal_selected = [...scope.querySelectorAll('#reappraisalCheck input')].map(i => i.checked);
    Object.assign(lastAnswers, { matching_complete, reappraisal_selected });
    if (!user || !supabase) { status.textContent = 'Sign in to save your progress on this activity.'; return; }
    status.textContent = 'Saving…';
    supabase.from('academy_learner_progress')
      .upsert({ user_id: user.id, project_id: PROJECT_ID, activity_answers: lastAnswers, updated_at: new Date().toISOString() }, { onConflict: 'user_id,project_id' })
      .then(({ error }) => { status.textContent = error ? ('Could not save: ' + error.message) : 'Saved.'; });
  }

  // Restore any previously saved match/checkbox state for a returning signed-in learner.
  if (lastAnswers.matching_complete) {
    matchWrap.querySelectorAll('[data-ability]').forEach(p => p.classList.add('correct'));
    matchWrap.querySelectorAll('[data-match]').forEach(p => p.classList.add('correct'));
    matchedCount = 4;
    matchStatus.textContent = '4 of 4 matched.';
    matchSuccess.classList.add('show');
  }
  if (Array.isArray(lastAnswers.reappraisal_selected)) {
    container.querySelectorAll('#reappraisalCheck input').forEach((box, i) => { box.checked = !!lastAnswers.reappraisal_selected[i]; });
  }
}

function wireQuiz(container){
  container.querySelector('#checkQuizBtn').addEventListener('click', () => {
    let score = 0;
    const questions = container.querySelectorAll('.quiz-q');
    questions.forEach(q => {
      const name = q.querySelector('input').name;
      const answer = q.dataset.answer;
      const options = q.querySelectorAll('.quiz-options label');
      const checked = q.querySelector(`input[name="${name}"]:checked`);
      options.forEach(l => l.classList.remove('correct','incorrect'));
      options.forEach(l => { if (l.querySelector('input').value === answer) l.classList.add('correct'); });
      if (checked && checked.value === answer) score++;
      else if (checked) checked.closest('label').classList.add('incorrect');
    });
    const scoreEl = container.querySelector('#quizScore');
    scoreEl.textContent = `Score: ${score} of ${questions.length}`;
    Object.assign(lastAnswers, { quiz_score: `${score}/${questions.length}` });
    if (user && supabase) {
      supabase.from('academy_learner_progress')
        .upsert({ user_id: user.id, project_id: PROJECT_ID, activity_answers: lastAnswers, updated_at: new Date().toISOString() }, { onConflict: 'user_id,project_id' });
    }
  });
}

function wireCommit(container){
  const status = container.querySelector('#commitStatus');
  const moment = container.querySelector('#commitMoment');
  let choice = lastAnswers.commit_choice || null;

  if (lastAnswers.commit_moment) moment.value = lastAnswers.commit_moment;
  container.querySelectorAll('.commit-pill').forEach(p => {
    if (p.dataset.choice === choice) p.classList.add('selected');
    p.addEventListener('click', () => {
      container.querySelectorAll('.commit-pill').forEach(x => x.classList.remove('selected'));
      p.classList.add('selected');
      choice = p.dataset.choice;
    });
  });

  container.querySelector('#saveCommitBtn').addEventListener('click', () => {
    Object.assign(lastAnswers, { commit_moment: moment.value, commit_choice: choice });
    if (!user || !supabase) { status.textContent = 'Sign in to save this — it stays right here in your account.'; return; }
    status.textContent = 'Saving…';
    supabase.from('academy_learner_progress')
      .upsert({ user_id: user.id, project_id: PROJECT_ID, activity_answers: lastAnswers, updated_at: new Date().toISOString() }, { onConflict: 'user_id,project_id' })
      .then(({ error }) => { status.textContent = error ? ('Could not save: ' + error.message) : 'Saved — come back anytime to see it.'; });
  });
}

async function saveProgress(index, pct){
  if (!supabase || !user) return;
  await supabase.from('academy_learner_progress').upsert({
    user_id: user.id, project_id: PROJECT_ID, current_section: index,
    total_sections: sections.length, percent_complete: pct, updated_at: new Date().toISOString()
  }, { onConflict: 'user_id,project_id' });
}

function init(){
  // Render immediately in guest mode -- the reading experience must never wait on
  // a network call. Progress-saving upgrades in place if/when Supabase loads.
  authline.textContent = 'Viewing as a guest.';
  signedOutBanner.hidden = false;
  renderSection(current);
  upgradeToAuthenticated();
}

async function upgradeToAuthenticated(){
  await loadSupabase();
  if (!supabase) {
    authline.textContent = 'Reading works offline of your account; progress-saving is temporarily unavailable.';
    return;
  }
  const { data: { session } } = await supabase.auth.getSession();
  user = session?.user || null;
  if (!user) {
    authline.textContent = 'Viewing as a guest.';
    signedOutBanner.hidden = false;
    return;
  }
  authline.textContent = 'Signed in — your progress and answers save automatically.';
  signedOutBanner.hidden = true;
  const { data } = await supabase.from('academy_learner_progress').select('*').eq('user_id', user.id).eq('project_id', PROJECT_ID).maybeSingle();
  if (data) {
    current = Math.min(data.current_section || 0, sections.length - 1);
    lastAnswers = data.activity_answers || {};
    renderSection(current);
  }
}

init();
</script>
