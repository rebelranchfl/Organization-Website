name: Academy Agent Runner — DISABLED

# OWNER DIRECTION — CURRENT STATE
#
# Academy automated production is temporarily offline.
# The downstream pipeline/backend must be repaired and verified before AI production
# is allowed to resume. This prevents agents from creating additional material that
# could require extensive rework because of unresolved downstream failures.
#
# This workflow intentionally contains no executable production job.
# Do not restore the former Water visual-production runner, hourly execution,
# polling/dispatch execution, or any other Academy production trigger without a
# new explicit owner decision followed by end-to-end verification of the pipeline.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Academy agent production is temporarily disabled pending backend/pipeline repair and end-to-end verification."
