name: Academy Run Agent Now

# Owner-triggered Academy execution. During the 2026-08-27 stop-work directive,
# RRA-2026-0001 is the only project this worker may modify.

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Claimed Academy run request UUID"
        required: false
        type: string
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  pages: write
  copilot-requests: write

concurrency:
  group: academy-run-agent-now-v4
  cancel-in-progress: false

jobs:
  run-water-visual-production:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: https://dfrwxpuojeiykaignyny.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_Ts45JL34s7yFGW5hlI0pUA_-HRUt18a
      PROJECT_ID: RRA-2026-0001
      PROJECT_PATH: rebel ranch academy/content-library/sustainability-agriculture/purifying-water-natural-materials
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Record starting commit
        id: start
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve or claim Water run request
        id: claim
        shell: bash
        env:
          DISPATCH_REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          request_id="${DISPATCH_REQUEST_ID:-}"
          if [[ -z "$request_id" ]]; then
            response=$(curl -fsS -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Content-Type: application/json" -d '{}' "$SUPABASE_URL/rest/v1/rpc/academy_claim_water_run")
            request_id=$(printf '%s' "$response" | jq -r '. // empty')
          fi
          if [[ -z "$request_id" || "$request_id" == "null" ]]; then
            echo "No owner-requested Water Visual Production run is pending."
            echo "has_request=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_request=true" >> "$GITHUB_OUTPUT"
          echo "request_id=$request_id" >> "$GITHUB_OUTPUT"
          echo "Using owner request $request_id"

      - name: Build owner-directed Visual Production prompt
        if: steps.claim.outputs.has_request == 'true'
        shell: bash
        run: |
          mkdir -p .agent-run
          cat > .agent-run/prompt.md <<'PROMPT'
          You are the RRA Visual Production Agent executing an OWNER-REQUESTED immediate corrective production cycle for RRA-2026-0001 — Water Through the Layers.

          All other Rebel Ranch Academy projects are stopped. Work only RRA-2026-0001.

          Read the project standards and owner-corrective-directive-2026-08-27.md before editing.

          OWNER FAILURES THAT MUST BE FIXED, NOT DESCRIBED:
          - public root learner routes returned 404s;
          - existing diagrams are flat box/wireframe graphics and are not acceptable as finished paid educational imagery;
          - text/leader lines/borders have collided or clipped wording;
          - the owner must not be used as QA.

          REQUIRED DURABLE OUTPUT THIS CYCLE:
          1. You MUST modify or create durable repository files. Analysis-only work is failure.
          2. You MUST create working root files water-learning-experience-final.html, water-system-visual-preview.html, and water-system-implementation-visuals.html if they do not exist. Root owner URLs must not 404.
          3. Do not call a rectangle-stack or box-and-arrow chart a finished physical-system visual. For filtration, show a recognizable bucket/barrel/vessel, visible rock/gravel/sand/carbon media texture or clearly illustrated material shapes, inlet/water level/flow direction/outlet, and labels that do not overlap artwork.
          4. Preserve evidence/safety boundaries; filtered-looking water is not automatically potable.
          5. Zero tolerance for clipping, overlap, hidden words, or leader-line collisions.
          6. Keep RRA-2026-0001 in VISUAL_PRODUCTION. Do not claim owner-ready or deployed QA without a deployed browser check.
          7. Write a concise cycle record inside visual-production documenting actual changed files and remaining work.
          8. Write .agent-run/result.json with progress_percent, progress_detail, progress_next, result_summary.

          IMPORTANT CAPABILITY BOUNDARY:
          This GitHub coding worker does not have a photographic image-generation model. Do not falsely claim photorealistic imagery was generated. If the required finished visual cannot be achieved with original SVG/CSS illustration, record that an image-generation asset worker is required instead of declaring the visual fixed.

          AUTHORIZED FILES ONLY:
          - rebel ranch academy/content-library/sustainability-agriculture/purifying-water-natural-materials/**
          - water-learning-experience-final.html
          - water-system-visual-preview.html
          - water-system-implementation-visuals.html
          - .agent-run/**
          PROMPT

      - name: Install GitHub Copilot CLI
        if: steps.claim.outputs.has_request == 'true'
        run: npm install -g @github/copilot

      - name: Run immediate RRA Visual Production agent
        id: agent
        if: steps.claim.outputs.has_request == 'true'
        shell: bash
        run: |
          set -o pipefail
          copilot --yolo -p "$(cat .agent-run/prompt.md)" 2>&1 | tee .agent-run/copilot-last-message.txt

      - name: Validate authorized scope and require durable work
        id: commit
        if: steps.claim.outputs.has_request == 'true' && steps.agent.outcome == 'success'
        shell: bash
        env:
          REQUEST_ID: ${{ steps.claim.outputs.request_id }}
        run: |
          set -euo pipefail
          mapfile -t changed < <( { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u )
          for f in "${changed[@]}"; do
            [[ -z "$f" ]] && continue
            case "$f" in
              .agent-run/*) ;;
              "$PROJECT_PATH"/*) ;;
              water-learning-experience-final.html|water-system-visual-preview.html|water-system-implementation-visuals.html) ;;
              *) echo "Unexpected file outside authorized Water Visual Production scope: $f"; exit 1 ;;
            esac
          done

          git add -A -- "$PROJECT_PATH" water-learning-experience-final.html water-system-visual-preview.html water-system-implementation-visuals.html 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "ERROR: Agent produced no durable Water Visual Production changes."
            exit 42
          fi

          for required in water-learning-experience-final.html water-system-visual-preview.html water-system-implementation-visuals.html; do
            if [[ ! -f "$required" ]]; then
              echo "ERROR: Required public root route missing: $required"
              exit 43
            fi
          done

          git config user.name "Rebel Ranch Academy Visual Production Runner"
          git config user.email "285707125+rebelranchfl@users.noreply.github.com"
          git commit -m "Advance Water corrective Visual Production" -m "Request: ${REQUEST_ID}" -m "AI-Agent: GitHub Copilot CLI via RRA immediate runner"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Request GitHub Pages rebuild from latest main
        if: steps.claim.outputs.has_request == 'true' && steps.commit.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"

      - name: Finalize immediate Water run status
        if: always() && steps.claim.outputs.has_request == 'true'
        shell: bash
        env:
          REQUEST_ID: ${{ steps.claim.outputs.request_id }}
          RESULT_COMMIT_SHA: ${{ steps.commit.outputs.sha }}
          START_SHA: ${{ steps.start.outputs.sha }}
          AGENT_OUTCOME: ${{ steps.agent.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
        run: |
          set -euo pipefail
          success=false
          if [[ "$AGENT_OUTCOME" == "success" && "$COMMIT_OUTCOME" == "success" && -n "${RESULT_COMMIT_SHA:-}" && "$RESULT_COMMIT_SHA" != "$START_SHA" ]]; then success=true; fi
          summary="Immediate Water Visual Production cycle finished."
          if [[ -f .agent-run/result.json ]]; then summary=$(jq -r '.result_summary // "Immediate Water Visual Production cycle finished."' .agent-run/result.json); fi
          error=""
          if [[ "$success" != "true" ]]; then error="Visual Production did not produce a new durable product commit (agent=${AGENT_OUTCOME}, commit=${COMMIT_OUTCOME}, start=${START_SHA}, result=${RESULT_COMMIT_SHA:-none})."; fi
          payload=$(jq -n --arg request_id "$REQUEST_ID" --argjson success "$success" --arg commit "${RESULT_COMMIT_SHA:-}" --arg summary "$summary" --arg error "$error" '{p_request_id:$request_id,p_success:$success,p_commit_sha:$commit,p_summary:$summary,p_error:$error}')
          curl -fsS -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Content-Type: application/json" -d "$payload" "$SUPABASE_URL/rest/v1/rpc/academy_complete_water_run"
