name: Academy Agent Immediate Dispatch

# Keeps the owner-facing Run Agent Now queue responsive instead of waiting for the next scheduled worker pickup.
# Current stop-work directive restricts dispatch to RRA-2026-0001.
# Owner-requested activation: 2026-08-27 11:53 ET.

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    paths:
      - ".github/workflows/academy-agent-immediate-dispatch.yml"
      - ".github/workflows/academy-agent-runner.yml"

permissions:
  actions: write
  contents: read

concurrency:
  group: academy-agent-immediate-dispatch-v1
  cancel-in-progress: true

jobs:
  watch-owner-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      SUPABASE_URL: https://dfrwxpuojeiykaignyny.supabase.co
      SUPABASE_BACKEND_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Watch Water queue and dispatch immediately
        shell: bash
        run: |
          set -euo pipefail
          KEY="${SUPABASE_BACKEND_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}"
          if [[ -z "$KEY" ]]; then
            echo "Supabase backend key is not configured."
            exit 1
          fi

          auth=(-H "apikey: $KEY")
          if [[ "$KEY" != sb_secret_* ]]; then
            auth+=(-H "Authorization: Bearer $KEY")
          fi

          endpoint="$SUPABASE_URL/rest/v1/academy_agent_run_requests?project_id=eq.RRA-2026-0001&requested_stage=eq.VISUAL_PRODUCTION&status=eq.PENDING&select=id&order=requested_at.asc&limit=1"

          for attempt in $(seq 1 23); do
            request_id=$(curl -fsS "${auth[@]}" "$endpoint" | jq -r '.[0].id // empty')
            if [[ -n "$request_id" ]]; then
              echo "Owner run request $request_id detected; dispatching Academy runner."
              gh api \
                --method POST \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/academy-agent-runner.yml/dispatches" \
                -f ref=main
              exit 0
            fi
            sleep 12
          done

          echo "No pending Water Run Agent Now request detected during this watch cycle."
