name: Academy Runner Contract QA

on:
  push:
    branches:
      - academy-production-work
    paths:
      - '.github/scripts/academy-agent-runner.mjs'
      - '.github/workflows/academy-agent-runner.yml'
      - '.github/workflows/academy-runner-contract-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-contract-qa:
    if: github.ref_name == 'academy-production-work'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Academy work branch
        uses: actions/checkout@v6

      - name: Syntax-check runner
        run: node --check .github/scripts/academy-agent-runner.mjs

      - name: Parse workflow YAML
        run: ruby -e 'require "yaml"; YAML.load_file(".github/workflows/academy-agent-runner.yml"); puts "ACADEMY_WORKFLOW_YAML_PARSE_PASS"'

      - name: Run runner contract self-test
        run: node .github/scripts/academy-agent-runner.mjs self-test

      - name: Enforce dormant-safe least-privilege boundaries
        shell: bash
        run: |
          set -euo pipefail
          script='.github/scripts/academy-agent-runner.mjs'
          workflow='.github/workflows/academy-agent-runner.yml'

          ! grep -q 'OPENAI_API_KEY' "$script"
          ! grep -q 'SUPABASE_BACKEND_KEY' "$script"
          ! grep -q 'SUPABASE_SERVICE_ROLE_KEY' "$script"
          ! grep -q '/rest/v1/' "$script"
          ! grep -q 'current main checkout' "$script"
          ! grep -q "current_status.*READY_FOR_REVIEW" "$script"
          ! grep -q "workflow_stage.*PRODUCT_REVIEW" "$script"
          ! grep -q "workflow_stage.*FINAL_PRODUCT_REVIEW" "$script"
          grep -q '/context' "$script"
          grep -q 'CALLBACK_TOKEN' "$script"
          grep -q 'independent verification is required before advancement' "$script"
          grep -q "github_branch==='main'" "$script"

          # All three production jobs remain hard-disabled.
          test "$(grep -E -c '^[[:space:]]+if:.*false' "$workflow")" -ge 3

          # No public deployment mechanism exists in the worker chain.
          ! grep -qi 'pages: write' "$workflow"
          ! grep -qi 'pages/build' "$workflow"
          ! grep -qi 'actions/deploy' "$workflow"
          ! grep -qi 'wrangler' "$workflow"
          ! grep -q 'HEAD:main' "$workflow"
          ! grep -q 'SUPABASE_BACKEND_KEY' "$workflow"
          ! grep -q 'SUPABASE_SERVICE_ROLE_KEY' "$workflow"

          # AI job is read-only and has no persisted checkout credential.
          grep -A7 '^  academy-worker:' "$workflow" | grep -q 'contents: read'
          grep -q 'persist-credentials: false' "$workflow"

          # Only the separate non-AI committer receives repository write authority.
          grep -A8 '^  commit-candidate:' "$workflow" | grep -q 'contents: write'
          grep -q 'Candidate patch escaped verified project path' "$workflow"
          grep -q 'git push origin "HEAD:${GITHUB_REF_NAME}"' "$workflow"

          echo 'ACADEMY_RUNNER_AND_WORKFLOW_BOUNDARIES_PASS'
