<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partner With Us | Rebel Ranch Ministries</title>
  <style>
    :root{--ink:#f0edd8;--muted:#d0cab0;--green:#4a7c59;--gold:#c17f24;--gold-bright:#ef9f27;--dark:#050806;--panel:#0b1710}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top left,#152a18 0,#07120a 35%,#050b06 100%);color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.5}a{color:inherit;text-decoration:none}.site-header{position:sticky;top:0;z-index:10;background:rgba(5,8,6,.98);border-bottom:1px solid #1e3a20}.site-nav{width:min(1160px,92vw);min-height:5.15rem;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:1.25rem}.brand{display:flex;align-items:center;gap:.8rem}.brand img{width:3.2rem;height:3.2rem;object-fit:contain}.brand strong,.brand small{display:block}.brand strong{font-size:1rem;line-height:1.05}.brand small{margin-top:.2rem;color:var(--gold-bright);font-size:.72rem;font-weight:700}.nav-menu{display:flex;align-items:center;gap:1.25rem;color:#c9c5a7;font-size:.9rem;font-weight:700}.nav-menu a:hover{color:var(--gold-bright)}.nav-menu .contact{padding:.68rem .95rem;border-radius:999px;background:linear-gradient(135deg,#c17f24,#7b4b13);color:#fff7de}main{width:min(860px,92vw);margin:auto;padding:68px 0 64px}.eyebrow{color:var(--gold-bright);font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}h1{font-size:clamp(38px,6vw,64px);line-height:1;margin:10px 0 18px}p{color:var(--muted)}.intro{max-width:720px;font-size:18px}.form-card{margin-top:30px;padding:28px;border:1px solid var(--green);border-radius:22px;background:linear-gradient(180deg,#102315,#0a160d)}form{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px}label{display:grid;gap:7px;color:var(--ink);font-weight:700}label.full{grid-column:1/-1}input,select,textarea{width:100%;padding:12px;border:1px solid #385d33;border-radius:10px;background:#07120a;color:var(--ink);font:inherit}textarea{min-height:140px;resize:vertical}.check{grid-column:1/-1;display:flex;align-items:flex-start;gap:10px;color:var(--muted);font-weight:400}.check input{width:auto;margin-top:4px}.btn{justify-self:start;padding:14px 19px;border:1px solid var(--gold);border-radius:999px;background:linear-gradient(135deg,#c17f24,#7b4b13);color:#fff7de;font-weight:800;font:inherit;cursor:pointer}.site-footer{padding:24px 0;background:var(--dark);border-top:1px solid #1d321e;text-align:center;color:#88836d;font-size:13px}.footer-inner{width:min(1160px,92vw);margin:auto}.footer-top{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;margin-bottom:12px}.footer-brand{display:flex;align-items:center;gap:10px;color:var(--ink);font-weight:900;letter-spacing:.06em;text-transform:uppercase}.footer-brand img{width:42px;height:42px;object-fit:contain}.footer-tag{color:var(--gold-bright);font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}.footer-links{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-bottom:10px}.footer-links a{color:#c7c1a6;font-weight:700}.footer-links a:hover{color:var(--gold-bright)}.footer-legal,.copyright{margin:0}.copyright{font-size:12px;margin-top:4px}@media(max-width:760px){.nav-menu{display:none}form{grid-template-columns:1fr}.btn{grid-column:1/-1}.footer-top{flex-direction:column;gap:8px}}
  </style>
  <link rel="stylesheet" href="assets/css/public-surface.css">
  <script src="assets/js/public-shell.js" defer></script>
</head>
<body class="rrm-phase-one">
  <main>
    <p class="eyebrow">Rebel Ranch Ministries</p>
    <h1>Partner With Us</h1>
    <p class="intro">Bring a skill, resource, product, service, or connection that can help support or grow our mission. Tell us what you have in mind, and Rebel Ranch Ministries will review your interest and follow up if there is a fit.</p>
    <div class="form-card">
      <form action="https://formspree.io/f/xnjrqydq" method="POST">
        <input type="hidden" name="form_type" value="Rebel Ranch Partnership Interest">
        <input type="hidden" name="_subject" value="Rebel Ranch Partnership Interest Form">
        <label>Full Name<input name="name" type="text" required></label>
        <label>Email Address<input name="email" type="email" required></label>
        <label>Phone Number (optional)<input name="phone" type="tel"></label>
        <label>Business or Organization (optional)<input name="organization" type="text"></label>
        <label class="full">How would you like to partner?<select name="partnership_type" required><option value="">Select one</option><option>Teach or share a skill</option><option>Provide a product, service, or resource</option><option>Support a local program or event</option><option>Help build the Marketplace</option><option>Donate time, materials, or expertise</option><option>Other</option></select></label>
        <label class="full">Tell us about your idea or what you can contribute<textarea name="details" required></textarea></label>
        <label class="check"><input type="checkbox" name="interest_acknowledgment" required><span>I understand this is an interest form only. It does not create employment, a vendor relationship, membership, a contract, or approval to participate.</span></label>
        <button class="btn" type="submit">Submit Partnership Interest</button>
      </form>
    </div>
  </main>
</body>
</html>
