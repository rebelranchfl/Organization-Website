<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creation Station | Enter the Parent Experience</title>
<meta name="description" content="Step inside the combined Creation Station parent experience and interactive dashboard preview.">
<link rel="canonical" href="https://rebelranchministries.org/creation-station-experience.html">
<style>
:root{--pink:#f04b98;--gold:#f7c94c;--aqua:#55d7d1;--purple:#22053e;--purple2:#381060;--ink:#241c2d}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{font-family:"Segoe UI",ui-sans-serif,system-ui,-apple-system,Roboto,Arial,sans-serif;background:#160329}
.entry{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;
  padding:1.5rem;color:#fff;text-align:center;
  background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.12),transparent 20%),linear-gradient(180deg,var(--purple),var(--purple2) 60%,#160329)
}
.entry img{width:min(15rem,48vw);filter:drop-shadow(0 1rem 2.1rem rgba(0,0,0,.32));animation:pulse 1.5s ease-in-out infinite alternate}
.entry h1{margin:1.5rem 0 .5rem;font-size:clamp(2rem,4vw,3.6rem);letter-spacing:-.05em}
.entry p{max-width:35rem;margin:0;color:#ede2f1;font-weight:720;line-height:1.55}
.progress{width:min(22.5rem,80vw);height:.875rem;margin-top:1.75rem;overflow:hidden;background:rgba(255,255,255,.16);border-radius:999px}
.progress span{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--pink),var(--gold),var(--aqua));animation:load 1.6s ease forwards}
.direct-link{margin-top:1.25rem;color:#fff;font-weight:800;text-underline-offset:.2rem}
.direct-link:focus-visible{outline:3px solid var(--gold);outline-offset:.3rem;border-radius:.25rem}
@keyframes pulse{from{transform:scale(.96)}to{transform:scale(1.04)}}
@keyframes load{from{width:0}to{width:100%}}
@media(prefers-reduced-motion:reduce){.entry img{animation:none}.progress span{width:100%;animation:none}}
</style>
</head>
<body>
<main class="entry" aria-live="polite">
  <img src="assets/Creation Station Logo.png" alt="Creation Station logo">
  <h1>Entering Creation Station</h1>
  <p>The parent explanation and hands-on dashboard preview now live together in one complete Creation Station experience.</p>
  <div class="progress" aria-label="Loading Creation Station"><span></span></div>
  <a class="direct-link" href="creation-station-experience.html">Continue to the combined experience</a>
</main>
<script>
sessionStorage.setItem('csEntryTransitionJustShown','1');
setTimeout(()=>{window.location.replace('creation-station-experience.html')},1650);
</script>
</body>
</html>
