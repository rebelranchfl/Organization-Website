name: Academy Run Agent Now

# Owner-triggered Academy execution. During the 2026-08-27 stop-work directive,
# RRA-2026-0001 is the only project this worker may modify.
# IMPORTANT: this GitHub worker is now an INTEGRATION/QA worker only for finished visuals.
# It is not authorized to substitute SVG wireframes for required image-generation assets.

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Claimed Academy run request UUID"
        required: false
        type: string
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  pages: write
  copilot-requests: write

concurrency:
  group: academy-run-agent-now-v5
  cancel-in-progress: false

jobs:
  run-water-visual-production:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: https://dfrwxpuojeiykaignyny.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_Ts45JL34s7yFGW5hlI0pUA_-HRUt18a
      PROJECT_ID: RRA-2026-0001
      PROJECT_PATH: rebel ranch academy/content-library/sustainability-agriculture/purifying-water-natural-materials
      VISUAL_ASSET_PATH: rebel ranch academy/content-library/sustainability-agriculture/purifying-water-natural-materials/visual-production/assets/generated
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Record starting commit
        id: start
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve or claim Water run request
        id: claim
        shell: bash
        env:
          DISPATCH_REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          request_id="${DISPATCH_REQUEST_ID:-}"
          if [[ -z "$request_id" ]]; then
            response=$(curl -fsS -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Content-Type: application/json" -d '{}' "$SUPABASE_URL/rest/v1/rpc/academy_claim_water_run")
            request_id=$(printf '%s' "$response" | jq -r '. // empty')
          fi
          if [[ -z "$request_id" || "$request_id" == "null" ]]; then
            echo "No owner-requested Water Visual Production run is pending."
            echo "has_request=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_request=true" >> "$GITHUB_OUTPUT"
          echo "request_id=$request_id" >> "$GITHUB_OUTPUT"
          echo "Using owner request $request_id"

      - name: Require finished image-generation assets before integration
        id: assets
        if: steps.claim.outputs.has_request == 'true'
        shell: bash
        run: |
          set -euo pipefail
          manifest="$VISUAL_ASSET_PATH/asset-manifest.json"
          if [[ ! -f "$manifest" ]]; then
            echo "ERROR: No image-generation asset manifest exists at $manifest"
            echo "The coding worker is not allowed to replace required finished imagery with SVG/CSS wireframes."
            exit 51
          fi
          jq -e '.pipeline == "IMAGE_GENERATION" and (.assets|type=="array") and (.assets|length>0)' "$manifest" >/dev/null
          missing=0
          while IFS= read -r rel; do
            [[ -z "$rel" ]] && continue
            if [[ ! -f "$VISUAL_ASSET_PATH/$rel" ]]; then
              echo "ERROR: Manifest asset missing: $VISUAL_ASSET_PATH/$rel"
              missing=1
            fi
          done < <(jq -r '.assets[].file' "$manifest")
          [[ "$missing" -eq 0 ]] || exit 52
          echo "Finished generated visual assets found and validated."

      - name: Build owner-directed visual integration prompt
        if: steps.claim.outputs.has_request == 'true' && steps.assets.outcome == 'success'
        shell: bash
        run: |
          mkdir -p .agent-run
          cat > .agent-run/prompt.md <<'PROMPT'
          You are the RRA Visual Integration + Browser QA Agent for RRA-2026-0001 — Water Through the Layers.

          ROLE BOUNDARY — NON-NEGOTIABLE
          Finished physical-system imagery must already exist under visual-production/assets/generated and must be listed in asset-manifest.json with pipeline=IMAGE_GENERATION.
          You are NOT the image-generation worker.
          You may NOT substitute box diagrams, rectangle stacks, generic SVG shapes, CSS art, or wireframes for required finished imagery.

          EXCLUSIVE PRIORITY
          Work only RRA-2026-0001. All other Academy projects remain stopped.

          REQUIRED WORK
          1. Read the project standards, approved manuscript, visual-production brief, owner-corrective-directive-2026-08-27.md, and the generated asset manifest before editing.
          2. Integrate the finished generated image assets into the learner-facing Water pages.
          3. Keep explanatory labels, evidence text, arrows, captions, and safety boundaries separate from the artwork when that prevents collisions or unreadable text.
          4. The filtration lesson must visibly use the generated realistic/illustrated physical-system asset showing a recognizable bucket/barrel/vessel, rocks/gravel/sand/carbon/media, water path, inlet/water level/outlet as appropriate to the approved lesson.
          5. Do not redraw the physical system with SVG/CSS merely because it is easier.
          6. Repair the public root learner routes water-learning-experience-final.html, water-system-visual-preview.html, and water-system-implementation-visuals.html so they do not 404.
          7. Zero tolerance for clipping, overlap, hidden words, leader-line collisions, broken images, broken links, or unreadable mobile layouts.
          8. Preserve all approved evidence and safety boundaries. Clearer/filtered-looking water is not automatically potable.
          9. Run local route/image/link checks. Do not claim deployed end-to-end QA unless the deployed public page was actually checked.
          10. Keep RRA-2026-0001 in VISUAL_PRODUCTION until all required imagery, integration, responsive checks, and deployed QA are complete.
          11. Create/update a concise cycle record with exact files changed and exact work remaining.
          12. Write .agent-run/result.json with progress_percent, progress_detail, progress_next, result_summary.

          AUTHORIZED FILES ONLY
          - rebel ranch academy/content-library/sustainability-agriculture/purifying-water-natural-materials/**
          - water-learning-experience-final.html
          - water-system-visual-preview.html
          - water-system-implementation-visuals.html
          - .agent-run/**
          PROMPT

      - name: Install GitHub Copilot CLI
        if: steps.claim.outputs.has_request == 'true' && steps.assets.outcome == 'success'
        run: npm install -g @github/copilot

      - name: Run Water visual integration agent
        id: agent
        if: steps.claim.outputs.has_request == 'true' && steps.assets.outcome == 'success'
        shell: bash
        run: |
          set -o pipefail
          copilot --yolo -p "$(cat .agent-run/prompt.md)" 2>&1 | tee .agent-run/copilot-last-message.txt

      - name: Validate authorized scope and require durable integration work
        id: commit
        if: steps.claim.outputs.has_request == 'true' && steps.assets.outcome == 'success' && steps.agent.outcome == 'success'
        shell: bash
        env:
          REQUEST_ID: ${{ steps.claim.outputs.request_id }}
        run: |
          set -euo pipefail
          mapfile -t changed < <( { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u )
          for f in "${changed[@]}"; do
            [[ -z "$f" ]] && continue
            case "$f" in
              .agent-run/*) ;;
              "$PROJECT_PATH"/*) ;;
              water-learning-experience-final.html|water-system-visual-preview.html|water-system-implementation-visuals.html) ;;
              *) echo "Unexpected file outside authorized Water Visual Production scope: $f"; exit 1 ;;
            esac
          done

          git add -A -- "$PROJECT_PATH" water-learning-experience-final.html water-system-visual-preview.html water-system-implementation-visuals.html 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "ERROR: Integration agent produced no durable Water Visual Production changes."
            exit 42
          fi

          for required in water-learning-experience-final.html water-system-visual-preview.html water-system-implementation-visuals.html; do
            [[ -f "$required" ]] || { echo "ERROR: Required public root route missing: $required"; exit 43; }
          done

          # The integrated learner files must actually reference at least one generated asset.
          if ! grep -R -q "visual-production/assets/generated\|assets/generated" \
            "$PROJECT_PATH/visual-production"/*.html \
            water-learning-experience-final.html water-system-visual-preview.html water-system-implementation-visuals.html 2>/dev/null; then
            echo "ERROR: Durable edit did not integrate generated visual assets."
            exit 53
          fi

          git config user.name "Rebel Ranch Academy Visual Integration Runner"
          git config user.email "285707125+rebelranchfl@users.noreply.github.com"
          git commit -m "Integrate generated Water visual assets" -m "Request: ${REQUEST_ID}" -m "AI-Agent: GitHub Copilot CLI integration/QA worker"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Request GitHub Pages rebuild from latest main
        if: steps.claim.outputs.has_request == 'true' && steps.commit.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"

      - name: Finalize immediate Water run status
        if: always() && steps.claim.outputs.has_request == 'true'
        shell: bash
        env:
          REQUEST_ID: ${{ steps.claim.outputs.request_id }}
          RESULT_COMMIT_SHA: ${{ steps.commit.outputs.sha }}
          START_SHA: ${{ steps.start.outputs.sha }}
          ASSET_OUTCOME: ${{ steps.assets.outcome }}
          AGENT_OUTCOME: ${{ steps.agent.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
        run: |
          set -euo pipefail
          success=false
          if [[ "$ASSET_OUTCOME" == "success" && "$AGENT_OUTCOME" == "success" && "$COMMIT_OUTCOME" == "success" && -n "${RESULT_COMMIT_SHA:-}" && "$RESULT_COMMIT_SHA" != "$START_SHA" ]]; then success=true; fi
          summary="Water Visual Integration cycle finished."
          if [[ -f .agent-run/result.json ]]; then summary=$(jq -r '.result_summary // "Water Visual Integration cycle finished."' .agent-run/result.json); fi
          error=""
          if [[ "$success" != "true" ]]; then
            error="Water Visual Production did not complete valid generated-asset integration (assets=${ASSET_OUTCOME}, agent=${AGENT_OUTCOME}, commit=${COMMIT_OUTCOME}, start=${START_SHA}, result=${RESULT_COMMIT_SHA:-none})."
          fi
          payload=$(jq -n --arg request_id "$REQUEST_ID" --argjson success "$success" --arg commit "${RESULT_COMMIT_SHA:-}" --arg summary "$summary" --arg error "$error" '{p_request_id:$request_id,p_success:$success,p_commit_sha:$commit,p_summary:$summary,p_error:$error}')
          curl -fsS -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Content-Type: application/json" -d "$payload" "$SUPABASE_URL/rest/v1/rpc/academy_complete_water_run"
